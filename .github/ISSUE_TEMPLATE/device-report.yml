name: Device report
description: Report how this library behaved against a real ZKTeco device
title: "[device] "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. This is the most useful contribution this project can
        receive — the compatibility table is empty until reports like yours
        fill it in.
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: e.g. MB360, iClock260, K40
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Usually under Menu → System Info on the device.
    validations:
      required: true
  - type: input
    id: serial_prefix
    attributes:
      label: Serial number prefix
      description: >
        The first four characters of `getIdentity().serialNumber`. Just the
        prefix — it identifies the production batch without identifying your
        specific unit.
  - type: input
    id: platform
    attributes:
      label: Platform and OS
      description: The `platform` and `os` fields from `getIdentity()`.
  - type: dropdown
    id: identity_refusals
    attributes:
      label: Did any identity field come back null?
      description: >
        A null means the device refused that keyword. Knowing which keywords a
        firmware exposes is checklist item 17 and cannot be answered without
        reports.
      options:
        ["did not test", "all five fields answered", "some came back null", "getIdentity() threw"]
  - type: dropdown
    id: clock_drift
    attributes:
      label: How far off was `getTime()` from the collecting machine's clock?
      options:
        ["did not test", "within a minute", "minutes off", "hours off", "wildly wrong or threw"]
  - type: dropdown
    id: transport
    attributes:
      label: Transport that worked
      options: ["tcp", "udp", "both", "neither"]
    validations:
      required: true
  - type: dropdown
    id: record_size
    attributes:
      label: Record size reported
      description: The `recordSize` field on any returned log.
      options: ["8", "16", "40", "it threw ZkFramingError", "did not get that far"]
    validations:
      required: true
  - type: dropdown
    id: comm_key
    attributes:
      label: Did the device require a comm key?
      options: ["no", "yes, and it worked", "yes, and it was rejected"]
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: Raw hex of one attendance record
      description: >
        The `raw` field from any log entry. Please redact nothing — it contains
        no personal data beyond a user id, and the byte layout is the whole
        point of the report.
      render: text
  - type: markdown
    attributes:
      value: |
        ### Realtime events (optional)

        Skip this section if you did not try `ZkDevice.subscribe()`.
  - type: dropdown
    id: realtime_events
    attributes:
      label: Do realtime events arrive?
      description: >
        This library never sends an acknowledgment back for a received event.
        If a real device expects one, the symptom is the third option below —
        exactly one event, then nothing more.
      options:
        ["did not test", "no events received at all", "exactly one event, then nothing more", "events keep arriving normally"]
  - type: dropdown
    id: realtime_payload_length
    attributes:
      label: Realtime event payload length
      description: The byte length of one pushed event's payload. Paste the raw hex below if you have it.
      options: ["did not test", "10 bytes (small dialect)", "36 bytes (large dialect)", "other length"]
  - type: dropdown
    id: realtime_idle
    attributes:
      label: Does a subscription survive an hour of idle time?
      description: Subscribe, then wait an hour with nobody badging, and check whether the stream is still open.
      options: ["did not test", "yes, still open after an hour", "no, the connection dropped"]
  - type: dropdown
    id: second_connection
    attributes:
      label: Does the device accept a second simultaneous connection on port 4370?
      description: Open one connection and, while it is still open, try opening a second one from another client.
      options:
        ["did not test", "yes, both connections worked at once", "no, the second connection was refused", "no, opening the second one dropped the first"]
  - type: textarea
    id: realtime_raw
    attributes:
      label: Raw hex of one realtime event payload
      description: The `raw` field from any received `ZkRealtimeEvent`, if you have one.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Timestamps off? Names garbled? Errors thrown? Paste them here.
